name: Organizer video fix

on:
  push:
    paths:
      - '.github/workflows/organizer-video-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install reliable organizer video loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="organizer-video-loader.js?v=20260810-hq2"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix organizer video quality'
          git push origin main
